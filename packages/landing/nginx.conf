server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;

  # Static assets → return real 404 if missing
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|json)$ {
    try_files $uri =404;
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }

  # All routes — serve pre-rendered index.html, real 404 otherwise
  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404/index.html;
  location = /404/index.html {
    internal;
  }
}
